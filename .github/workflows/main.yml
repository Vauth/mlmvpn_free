# Build Android APKs for MLM VPN (mlmvpn_free).
#
# What it builds, from the project's own build files:
#   - The chat core's native library (libmlmchat.so) from the Rust
#     sources in mlm-chat/, via mlm-chat/android/scripts/build-native.sh.
#     That library is NOT kept in git, so this step is what makes the
#     APK actually contain it.
#   - The app with Gradle 8.13 (the version in gradle/wrapper/),
#     AGP 8.13.2 and Kotlin 2.1.0 (root build.gradle), JDK 21 (the
#     toolchainVersion in gradle/gradle-daemon-jvm.properties and the
#     Android Studio JBR the project is built with locally).
#   - Debug APKs (assembleDebug) and release APKs (assembleRelease,
#     R8 on, unsigned unless the signing secrets below are set).
#     ABI splits are on (arm64-v8a, armeabi-v7a, universal), so each
#     build produces three APKs.
#
# What it does NOT do, and why:
#   - The build uses the Gradle Wrapper (./gradlew), not a Gradle
#     installed by the setup-gradle action: asking the action to
#     provision a specific version ("Provision Gradle 8.13") invokes
#     the runner image's preinstalled Gradle at /usr/bin/gradle,
#     which exits 1 and kills the step before anything builds. The
#     wrapper (gradle-wrapper.properties pins gradle-8.13-all.zip,
#     gradle-wrapper.jar is in the repo) downloads exactly 8.13
#     itself, and the action only configures caching and validates
#     the wrapper. The gradlew script itself is missing from the
#     repo (only gradlew.bat was committed), so the workflow
#     downloads the official Gradle 8.13 script at run time and
#     checks its hash before using it — no extra file is added to
#     the repo.
#   - It does not build the other native cores (libtunnelcore,
#     libaether, libtun2proxy, libtmessages, ...): those are
#     prebuilt .so files that are NOT in the repo on main
#     (app/src/main/jniLibs and chat/TMessagesProj/src/main/
#     jniLibs do not exist there). They are runtime-only, so the
#     Gradle build still runs and the APKs still build without
#     them, but the APKs will be missing those libraries until
#     they are pushed to the repo (Git LFS, as the README says
#     they are tracked). The "Check the APK" step below lists
#     exactly which ones are missing so it is visible, not
#     silent. The three prebuilt .aar libraries in app/libs are
#     different: the code imports their classes, so without them
#     the build dies at :app:compileDebugKotlin with 153
#     "Unresolved reference" errors. The "Fetch prebuilt AARs"
#     step below downloads those three from their official
#     public sources and verifies each one (SHA-256, and the
#     Psiphon one is repackaged by the repo's own script), so no
#     file has to be added to the repo for the build to compile.
#
# One project quirk the workflow works around (see the comment on
# the gradle.properties step): gradle.properties hardcodes a
# Windows JDK path (org.gradle.java.home, plus
# org.gradle.java.installations.paths) and a Windows temp dir for
# the JDK's Unix sockets (org.gradle.jvmargs). On the Linux runner
# those paths do not exist, and -Dorg.gradle.java.home on the
# command line does not fix it — the daemon reads that value
# straight from the file when it picks its JVM. The workflow
# strips those lines from the checkout for the run only; the file
# in the repo is untouched, and the runner then uses JAVA_HOME
# (Temurin 21 from setup-java).
name: Build Android APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # LFS on: the native libraries and data files are tracked with
      # Git LFS (.gitattributes: *.so, *.dat, *.apk, *.aab). Without
      # it the checkout holds small pointer files instead of the real
      # libraries, and the APK would ship those pointers.
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Fail fast if the three local AARs are missing: without them
      # the build wastes ~17 minutes (SDK + Rust + Gradle) and then
      # dies at :app:compileDebugKotlin with 153 "Unresolved
      # reference" errors. Proven by the 2026-11-26 run (commit
      # c6b660b2, test step 03:35-03:43 UTC): every error traces to
      # one of these three libraries, and nothing else is broken —
      #   libv2ray (V2RayPoint/startLoop/stopLoop, in
      #     FrontLabReceiver, VlessXrayInjector, XrayMeasureService,
      #     CombineEngine, FreeConfigEngine, StoreManager),
      #   PsiphonTunnel (TunnelVpnService, PsiphonProbeService —
      #     plus a cascade of "'...' overrides nothing" once the
      #     base class is unresolved),
      #   com.wsnet.lib.* / WSNetServerAPI (WindscribeApi,
      #     WindscribeEngine).
      # They live in app/libs/ (libv2ray.aar,
      # psiphontunnel-2.0.39-ns.aar, wsnet.aar) and are NOT in the
      # repo on main — the workflow cannot download or build them,
      # so Rian must push them from his machine (where Android
      # Studio builds) via Git LFS. Note .gitattributes does NOT
      # track *.aar in LFS yet (only .so/.dat/.apk/.aab), so add
      #   *.aar filter=lfs diff=lfs merge=lfs -text
      # to .gitattributes first, or the AARs land as 30MB+ regular
      # blobs. The missing .so files do NOT block the build (only
      # runtime); the "Check the APK" step below lists them.
      - name: Check the local AARs are present
        run: |
          MISSING=0
          for aar in libv2ray.aar psiphontunnel-2.0.39-ns.aar wsnet.aar; do
            if [ -f "app/libs/$aar" ]; then
              echo "OK: app/libs/$aar ($(du -h "app/libs/$aar" | cut -f1))"
            else
              echo "::error::Missing app/libs/$aar — push it to the repo via Git LFS (see the comment on this step)."
              MISSING=1
            fi
          done
          if [ "$MISSING" = 1 ]; then
            echo "The app code imports libv2ray, PsiphonTunnel and com.wsnet.lib.* from these AARs;"
            echo "without them :app:compileDebugKotlin fails with 153 Unresolved reference errors."
            echo "From your machine: add '*.aar filter=lfs diff=lfs merge=lfs -text' to .gitattributes,"
            echo "then: git lfs install && git add app/libs/*.aar .gitattributes && git commit && git push"
            exit 1
          fi

      # JDK 21: the toolchainVersion in
      # gradle/gradle-daemon-jvm.properties, and the Android Studio
      # JBR the project builds with locally. AGP 8.13 needs 17+;
      # 21 is what this project actually uses.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # packages: platform-tools — NOT the action's default. The
      # default is 'tools platform-tools', and Google removed the
      # legacy 'tools' package from the SDK repository, so the bare
      # call dies with "Failed to find package 'tools'" (exit 1)
      # before any build work runs. The next step installs
      # platform-tools again along with the rest, so nothing is lost.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # compileSdk 36 and build-tools 36.0.0 (app and the Telegram
      # fork), NDK r27 (the minimum build-native.sh asks for).
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"

      # The Rust core (mlm-chat): stable toolchain plus the two
      # Android targets the app ships. No rust-toolchain.toml in
      # the repo, so stable is what the project builds with.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk

      # The Rust release build (LTO, one codegen unit) is the slow
      # part of this workflow. Cache the registry and the shared
      # target dir (mlm-chat/core/target) so a rebuild after a
      # small change does not recompile every dependency.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mlm-chat/core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mlm-chat/android/jni/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Builds libmlmchat.so for arm64-v8a and armeabi-v7a into
      # mlm-chat/android/core/src/main/jniLibs/. It is a build
      # output, not kept in git, so without this step the APK has
      # no chat core at all.
      - name: Build the chat core native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash mlm-chat/android/scripts/build-native.sh

      # No gradlew script in the repo (only gradlew.bat), so the
      # workflow downloads the official Gradle 8.13 script itself
      # and verifies it byte for byte (the git blob hash of the
      # official file) before trusting it. Nothing new is committed
      # to the repo.
      - name: Download the Gradle wrapper script
        run: |
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew
          test "$(git hash-object gradlew)" = "d24fc200c47ebdfa6f663f088eb0530e401a47ae"
          chmod +x gradlew

      # gradle.properties hardcodes Windows-only paths: the
      # Android Studio JBR as org.gradle.java.home (and as
      # org.gradle.java.installations.paths) and a Windows temp dir
      # for the JDK's Unix sockets (org.gradle.jvmargs
      # -Djdk.net.unixdomain.tmpdir=C:\gradle-tmp). On Linux the
      # JBR path does not exist, and -Dorg.gradle.java.home on the
      # command line does NOT fix it: the daemon reads that value
      # straight from this file when it picks its JVM, so the build
      # dies with "Cannot convert relative path C:/Program
      # Files/Android/Android Studio/jbr to an absolute file".
      # Strip those lines for this run only — the file in the repo
      # is untouched, the checkout is thrown away after the run —
      # and the runner then uses JAVA_HOME (Temurin 21 from
      # setup-java). The proper fix is to make gradle.properties
      # cross-platform; until then this step carries it.
      - name: Make gradle.properties Linux-friendly
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.paths=/d' gradle.properties
          sed -i 's/ -Djdk\.net\.unixdomain\.tmpdir=[^ ]*//' gradle.properties
          echo "--- gradle.properties after cleanup ---"
          cat gradle.properties

      # The app's code imports three libraries that ship as .aar
      # files in app/libs/ — libv2ray (Xray), PsiphonTunnel and
      # Windscribe's wsnet — and app/libs/ is not in the repo, so
      # the last run died at :app:compileDebugKotlin with 153
      # "Unresolved reference" errors, all from those three. This
      # step fetches the exact binaries the code was written
      # against and verifies each one before trusting it:
      #
      # - libv2ray.aar v26.7.31, from 2dust/AndroidLibXrayLite.
      #   v26.7.31 is the newest release whose API has everything
      #   the code uses: v26.3.27 (the version the docs name) has
      #   no ProcessFinder, and v26.8.20+ dropped queryStats. The
      #   code uses both, so the window is v26.6.x–v26.7.31.
      # - psiphontunnel-2.0.39.aar, from Psiphon-Labs'
      #   psiphon-tunnel-core-binaries, pinned to the commit
      #   published the day after the v2.0.39 release. It is then
      #   repackaged by the repo's own script
      #   (scripts/repackage-psiphon-aar.py) into
      #   psiphontunnel-2.0.39-ns.aar — the -ns copy the build
      #   uses — because both gomobile libraries ship the same
      #   go.Seq classes and the same libgojni.so, and shipping
      #   both unmodified fails the build twice over. The pristine
      #   copy is deleted after repackaging, as the project's own
      #   third_party README instructs.
      # - wsnet.aar, from the official Windscribe Android source at
      #   the exact commit the project's third_party README names,
      #   SHA-checked against the hash recorded there.
      #
      # Nothing is committed to the repo: the files land in the
      # throwaway checkout only. If the AARs are later pushed to
      # app/libs/ in the repo, this step just re-downloads the same
      # verified bytes over them.
      - name: Fetch prebuilt AARs
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
          test "$(sha256sum app/libs/libv2ray.aar | cut -d' ' -f1)" = "a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3"
          curl -fsSL -o app/libs/psiphontunnel-2.0.39.aar https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/3201ac05bbc1efe95e535a843b089a2298813b7b/android/ca.psiphon.aar
          test "$(sha256sum app/libs/psiphontunnel-2.0.39.aar | cut -d' ' -f1)" = "11f9f7bc99c0c06d6d4f43cdb794e6d8d4a152f2c51c7d9322379036cbf8aef9"
          python3 scripts/repackage-psiphon-aar.py app/libs/psiphontunnel-2.0.39.aar
          rm app/libs/psiphontunnel-2.0.39.aar
          curl -fsSL -o app/libs/wsnet.aar https://raw.githubusercontent.com/Windscribe/Android-App/2c585dd5979ba93655853d56d849ed8ad2c964cb/base/src/main/libs/wsnet.aar
          test "$(sha256sum app/libs/wsnet.aar | cut -d' ' -f1)" = "5b0145d526aa10f6b7ec094639bfc8dc2f187d76d1b70915cf4da4802b822f11"
          ls -la app/libs/

      # The wrapper provides Gradle 8.13 itself (see the header
      # comment): no gradle-version here, so the action never
      # provisions a version and never touches /usr/bin/gradle.
      # It only configures caching and validates the wrapper jars.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tests are scoped to the app module only (:app:), NOT the
      # bare testDebugUnitTest the whole project: the bare task runs
      # unit tests for every module, including the Telegram fork's
      # vendored media3 libraries, and those cannot resolve their
      # test classpath here — media-lib-decoder-flac's unit tests
      # need project media-test-data, but that module's directory
      # (libraries/test_data) is not in the repo, so it has no
      # variants and Gradle fails with "No matching variant of
      # project ... media-test-data was found". The app's own tests
      # (app/src/test) do not need it, and the fork's libraries
      # are dependencies to build against, not modules to test.
      # The test report below is already the app's, so it is
      # unchanged.
      - name: Run unit tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # Lint runs as a report, not a gate: this is a large codebase
      # with a Telegram fork in it, and pre-existing lint findings
      # must not block the APKs. The report is uploaded below.
      - name: Lint (report only)
        continue-on-error: true
        run: >-
          ./gradlew lintDebug
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # Debug APKs, signed with the debug key as usual. Three APKs:
      # arm64-v8a, armeabi-v7a and universal.
      - name: Build debug APKs
        run: >-
          ./gradlew assembleDebug
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # Release APKs (R8 on). Unsigned by default: the release
      # build type has no signing config, and the project signs real
      # releases in Android Studio. To get signed release APKs from
      # CI instead, add four repository secrets — KEYSTORE_BASE64
      # (the keystore file, base64-encoded), KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD — and this step signs with them.
      # With no secrets set it just builds the unsigned APKs.
      - name: Build release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          SIGN_ARGS=""
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            SIGN_ARGS="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"
          fi
          # shellcheck disable=SC2086: $SIGN_ARGS is intentionally word-split.
          ./gradlew assembleRelease $SIGN_ARGS \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # The APK must contain the chat core this workflow built. The
      # other native cores are prebuilt files that are not in the
      # repo yet (see the header comment), so they are reported, not
      # failed on — but they are reported loudly, so a missing core
      # never ships silently.
      - name: Check the APK's native libraries
        run: |
          APK=$(ls app/build/outputs/apk/debug/*universal-debug.apk)
          echo "Checking $APK"
          unzip -l "$APK" | grep '\.so$' || echo "(no .so files in the APK)"
          if ! unzip -l "$APK" | grep -q 'libmlmchat\.so'; then
            echo "::error::libmlmchat.so is missing from the APK — the native core build did not land in the package."
            exit 1
          fi
          for lib in libtunnelcore.so libtunneljni.so libtun2socks.so libaether.so libtun2proxy.so libgst-core.so libtmessages.so; do
            unzip -l "$APK" | grep -q "$lib" || echo "::warning::$lib is missing from the APK — push the prebuilt library to the repo (Git LFS) to include it."
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mlmvpn-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mlmvpn-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 30

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 30
          
