name: Build Android APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  # contents: write (not read): the tag build attaches the signed
  # release APKs to the GitHub Release for that tag, and that needs
  # write access to the repo's contents. Nothing else in this
  # workflow writes to the repo.
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # LFS on: the native libraries and data files are tracked with
      # Git LFS (.gitattributes: *.so, *.dat, *.apk, *.aab). Without
      # it the checkout holds small pointer files instead of the real
      # libraries, and the APK would ship those pointers.
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          lfs: true

      # The runner has about 14 GB of free disk and this build is
      # huge (Android SDK + NDK, a Rust core, Gradle caches, and
      # the Telegram fork's build outputs), so the numbers go in
      # the log first — if a run ever dies again, the disk and
      # memory state is visible instead of a guess.
      - name: Show disk and memory
        run: |
          df -h
          free -h
          nproc

      # Free disk space before the heavy build. A run kept being
      # cancelled at :TMessagesProj:mergeDebugJavaResource with no
      # Gradle error and a 22-minute "Complete job" cleanup — the
      # shape of a runner that ran out of disk (or memory) and
      # whose agent died, which GitHub reports as "The operation
      # was canceled". This removes the preinstalled things the
      # build never uses (.NET, Haskell, large apt packages,
      # Docker images) and logs how much each one freed.
      # android: false is essential — the default would delete the
      # Android SDK this build needs. swap-storage and
      # preinstalled-runtimes stay off (their defaults): removing
      # swap makes a memory-short job die with no traceable error,
      # and this job is short on memory too on the 2-core/8 GB
      # private-repo runner.
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2
        with:
          android: false

      # JDK 21: the toolchainVersion in
      # gradle/gradle-daemon-jvm.properties, and the Android Studio
      # JBR the project builds with locally. AGP 8.13 needs 17+;
      # 21 is what this project actually uses.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # packages: platform-tools — NOT the action's default. The
      # default is 'tools platform-tools', and Google removed the
      # legacy 'tools' package from the SDK repository, so the bare
      # call dies with "Failed to find package 'tools'" (exit 1)
      # before any build work runs. The next step installs
      # platform-tools again along with the rest, so nothing is lost.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # compileSdk 36 and build-tools 36.0.0 (app and the Telegram
      # fork), NDK r27 (the minimum build-native.sh asks for).
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"

      # The Rust core (mlm-chat): stable toolchain plus the two
      # Android targets the app ships. No rust-toolchain.toml in
      # the repo, so stable is what the project builds with.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk

      # The Rust release build (LTO, one codegen unit) is the slow
      # part of this workflow. Cache the registry and the shared
      # target dir (mlm-chat/core/target) so a rebuild after a
      # small change does not recompile every dependency.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mlm-chat/core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mlm-chat/android/jni/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Builds libmlmchat.so for arm64-v8a and armeabi-v7a into
      # mlm-chat/android/core/src/main/jniLibs/. It is a build
      # output, not kept in git, so without this step the APK has
      # no chat core at all.
      - name: Build the chat core native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash mlm-chat/android/scripts/build-native.sh

      # No gradlew script in the repo (only gradlew.bat), so the
      # workflow downloads the official Gradle 8.13 script itself
      # and verifies it byte for byte (the git blob hash of the
      # official file) before trusting it. Nothing new is committed
      # to the repo.
      - name: Download the Gradle wrapper script
        run: |
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew
          test "$(git hash-object gradlew)" = "d24fc200c47ebdfa6f663f088eb0530e401a47ae"
          chmod +x gradlew

      # gradle.properties hardcodes Windows-only paths: the
      # Android Studio JBR as org.gradle.java.home (and as
      # org.gradle.java.installations.paths) and a Windows temp dir
      # for the JDK's Unix sockets (org.gradle.jvmargs
      # -Djdk.net.unixdomain.tmpdir=C:\gradle-tmp). On Linux the
      # JBR path does not exist, and -Dorg.gradle.java.home on the
      # command line does NOT fix it: the daemon reads that value
      # straight from this file when it picks its JVM, so the build
      # dies with "Cannot convert relative path C:/Program
      # Files/Android/Android Studio/jbr to an absolute file".
      # Strip those lines for this run only — the file in the repo
      # is untouched, the checkout is thrown away after the run —
      # and the runner then uses JAVA_HOME (Temurin 21 from
      # setup-java). The proper fix is to make gradle.properties
      # cross-platform; until then this step carries it.
      - name: Make gradle.properties Linux-friendly
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          sed -i '/^org\.gradle\.java\.installations\.paths=/d' gradle.properties
          sed -i 's/ -Djdk\.net\.unixdomain\.tmpdir=[^ ]*//' gradle.properties
          echo "--- gradle.properties after cleanup ---"
          cat gradle.properties

      # The app's code imports three libraries that ship as .aar
      # files in app/libs/ — libv2ray (Xray), PsiphonTunnel and
      # Windscribe's wsnet — and app/libs/ is not in the repo, so
      # the last run died at :app:compileDebugKotlin with 153
      # "Unresolved reference" errors, all from those three. This
      # step fetches the exact binaries the code was written
      # against and verifies each one before trusting it:
      #
      # - libv2ray.aar v26.7.31, from 2dust/AndroidLibXrayLite.
      #   v26.7.31 is the newest release whose API has everything
      #   the code uses: v26.3.27 (the version the docs name) has
      #   no ProcessFinder, and v26.8.20+ dropped queryStats. The
      #   code uses both, so the window is v26.6.x–v26.7.31.
      # - psiphontunnel-2.0.39.aar, from Psiphon-Labs'
      #   psiphon-tunnel-core-binaries, pinned to the commit
      #   published the day after the v2.0.39 release. It is then
      #   repackaged by the repo's own script
      #   (scripts/repackage-psiphon-aar.py) into
      #   psiphontunnel-2.0.39-ns.aar — the -ns copy the build
      #   uses — because both gomobile libraries ship the same
      #   go.Seq classes and the same libgojni.so, and shipping
      #   both unmodified fails the build twice over. The pristine
      #   copy is deleted after repackaging, as the project's own
      #   third_party README instructs.
      # - wsnet.aar, from the official Windscribe Android source at
      #   the exact commit the project's third_party README names,
      #   SHA-checked against the hash recorded there.
      #
      # Nothing is committed to the repo: the files land in the
      # throwaway checkout only. If the AARs are later pushed to
      # app/libs/ in the repo, this step just re-downloads the same
      # verified bytes over them.
      - name: Fetch prebuilt AARs
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
          test "$(sha256sum app/libs/libv2ray.aar | cut -d' ' -f1)" = "a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3"
          curl -fsSL -o app/libs/psiphontunnel-2.0.39.aar https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/3201ac05bbc1efe95e535a843b089a2298813b7b/android/ca.psiphon.aar
          test "$(sha256sum app/libs/psiphontunnel-2.0.39.aar | cut -d' ' -f1)" = "11f9f7bc99c0c06d6d4f43cdb794e6d8d4a152f2c51c7d9322379036cbf8aef9"
          python3 scripts/repackage-psiphon-aar.py app/libs/psiphontunnel-2.0.39.aar
          rm app/libs/psiphontunnel-2.0.39.aar
          curl -fsSL -o app/libs/wsnet.aar https://raw.githubusercontent.com/Windscribe/Android-App/2c585dd5979ba93655853d56d849ed8ad2c964cb/base/src/main/libs/wsnet.aar
          test "$(sha256sum app/libs/wsnet.aar | cut -d' ' -f1)" = "5b0145d526aa10f6b7ec094639bfc8dc2f187d76d1b70915cf4da4802b822f11"
          ls -la app/libs/

      # The native cores the app cannot run without — the Telegram
      # chat library (libtmessages.49.so) and the tunnel core
      # (libtunnelcore.so + libtunneljni.so), plus the other engine
      # libraries (aether, tor, obfs4, geph, lantern, OpenVPN,
      # Windscribe, ...) — are prebuilt .so files whose sources
      # were never committed to the repo (the tunnel core's Rust
      # source and its build script were never in git; neither
      # were the Telegram jni sources). Without them the app
      # crash-loops at startup (ApplicationLoader cannot load
      # libtmessages.49.so) and the VPN service crashes on destroy
      # (TunnelEngine.nativeStop has no implementation). This step
      # fetches the official MLM VPN 1.2.45 APKs — the last version
      # that shipped all of them — and takes the libraries out:
      #
      # - arm64-v8a: version code 2000081, from the Appteka
      #   listing (app id 820r334869).
      # - armeabi-v7a: version code 1000081, from the Appteka
      #   listing (app id c0cr334862).
      #
      # Appteka's download links are signed and short-lived, so
      # the step fetches each listing page at run time and reads
      # the fresh signed link out of it, then verifies the APK
      # byte for byte (SHA-256) before trusting it. The libraries
      # land in the standard jniLibs folders, so the Gradle build
      # packages them into the APK: the engine libraries into
      # app/src/main/jniLibs/<abi>/, and libtmessages.49.so into
      # chat/TMessagesProj/src/main/jniLibs/<abi>/ (the Telegram
      # fork's own folder — that is the only library it loads).
      # libmlmchat.so is NOT taken from the APK: the workflow
      # builds it fresh from the Rust sources in mlm-chat/ (the
      # "Build the chat core native library" step above), and the
      # APK's copy is the stale 1.2.45 build.
      #
      # Trust note: Appteka is a third-party mirror, not the
      # official source (the official 1.2.45 APKs were never
      # published on GitHub — the upstream's only release is
      # 1.2.49, which no longer ships these libraries). The APKs
      # are therefore verified by SHA-256 against the hashes of
      # the copies inspected on 2026-11-26, and the extracted
      # libraries were checked to export exactly the JNI methods
      # the app's code calls. The signing certificate could not be
      # verified (the APKs carry v2/v3 signatures only), so if a
      # hash ever stops matching, the step fails loudly instead of
      # shipping something else.
      #
      # Nothing is committed to the repo: the APKs are downloaded
      # into the runner's temp dir and deleted after extraction.
      - name: Fetch the native libraries
        run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          TMP="$RUNNER_TEMP/nativelibs"
          mkdir -p "$TMP"
          # arm64-v8a (version code 2000081)
          ARM64_URL=$(curl -fsSL -A "$UA" https://appteka.store/app/820r334869 | grep -oP 'download/334869/com\.mlmvpn\.scanner_1\.2\.45_2000081\.apk\?e=\d+\\u0026s=[A-Za-z0-9_-]+' | head -1 | sed 's/\\u0026/\&/g' | sed 's|^|https://appteka.store/|')
          if [ -z "$ARM64_URL" ]; then
            echo "::error::Could not find the arm64-v8a 1.2.45 APK download link on Appteka (the listing page may have changed). Check https://appteka.store/app/820r334869"
            exit 1
          fi
          curl -fsSL -A "$UA" -e https://appteka.store/app/820r334869 -o "$TMP/mlmvpn-1.2.45-arm64.apk" "$ARM64_URL"
          test "$(sha256sum "$TMP/mlmvpn-1.2.45-arm64.apk" | cut -d' ' -f1)" = "fc16c090032f949d3484e71e633cb26be66b4b57e481a08d430870dbd8c97a2a"
          # armeabi-v7a (version code 1000081)
          ARM32_URL=$(curl -fsSL -A "$UA" https://appteka.store/app/c0cr334862 | grep -oP 'download/334862/com\.mlmvpn\.scanner_1\.2\.45_1000081\.apk\?e=\d+\\u0026s=[A-Za-z0-9_-]+' | head -1 | sed 's/\\u0026/\&/g' | sed 's|^|https://appteka.store/|')
          if [ -z "$ARM32_URL" ]; then
            echo "::error::Could not find the armeabi-v7a 1.2.45 APK download link on Appteka (the listing page may have changed). Check https://appteka.store/app/c0cr334862"
            exit 1
          fi
          curl -fsSL -A "$UA" -e https://appteka.store/app/c0cr334862 -o "$TMP/mlmvpn-1.2.45-armeabi.apk" "$ARM32_URL"
          test "$(sha256sum "$TMP/mlmvpn-1.2.45-armeabi.apk" | cut -d' ' -f1)" = "498db4cb643ce2da6bf9f6098e04ac262d255ef88c910b3a9917e91038961ea7"
          # Unpack the libraries into the jniLibs folders. The
          # engine libraries go to the app; libtmessages.49.so
          # goes to the Telegram fork; libmlmchat.so is skipped
          # (built fresh from source above).
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a chat/TMessagesProj/src/main/jniLibs/arm64-v8a chat/TMessagesProj/src/main/jniLibs/armeabi-v7a
          unzip -o -q "$TMP/mlmvpn-1.2.45-arm64.apk" "lib/arm64-v8a/*.so" -x "lib/arm64-v8a/libmlmchat.so" -d "$TMP/x64"
          mv "$TMP/x64/lib/arm64-v8a/libtmessages.49.so" chat/TMessagesProj/src/main/jniLibs/arm64-v8a/
          mv "$TMP/x64/lib/arm64-v8a/"*.so app/src/main/jniLibs/arm64-v8a/
          unzip -o -q "$TMP/mlmvpn-1.2.45-armeabi.apk" "lib/armeabi-v7a/*.so" -x "lib/armeabi-v7a/libmlmchat.so" -d "$TMP/x32"
          mv "$TMP/x32/lib/armeabi-v7a/libtmessages.49.so" chat/TMessagesProj/src/main/jniLibs/armeabi-v7a/
          mv "$TMP/x32/lib/armeabi-v7a/"*.so app/src/main/jniLibs/armeabi-v7a/
          # The APKs are large (~390 MB together); the libraries
          # are out, so delete them before the Gradle build.
          rm -f "$TMP/mlmvpn-1.2.45-arm64.apk" "$TMP/mlmvpn-1.2.45-armeabi.apk"
          echo "--- app jniLibs ---"
          ls app/src/main/jniLibs/arm64-v8a/ app/src/main/jniLibs/armeabi-v7a/
          echo "--- Telegram fork jniLibs ---"
          ls chat/TMessagesProj/src/main/jniLibs/arm64-v8a/ chat/TMessagesProj/src/main/jniLibs/armeabi-v7a/

      # The wrapper provides Gradle 8.13 itself (see the header
      # comment): no gradle-version here, so the action never
      # provisions a version and never touches /usr/bin/gradle.
      # It only configures caching and validates the wrapper jars.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Debug APKs, signed with the debug key as usual. Three APKs:
      # arm64-v8a, armeabi-v7a and universal. Runs on every push
      # that is not a v* tag; a tag build skips this and builds the
      # signed release instead.
      #
      # The Gradle daemon heap is 3 GB, not 4: a private repo gets
      # a 2-core/8 GB runner, and a 4 GB daemon plus the Kotlin
      # daemon plus the OS and the runner agent left no headroom —
      # when the runner runs out of memory its agent dies and
      # GitHub reports the job as "canceled" with no Gradle error.
      - name: Build debug APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >-
          ./gradlew assembleDebug
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # Release APKs (R8 on), only on a v* tag, and only signed:
      # the project signs real releases in Android Studio, and a
      # tag build exists to ship a release, so an unsigned release
      # APK would be a silent mistake. The four repository secrets
      # are KEYSTORE_BASE64 (the keystore file, base64-encoded),
      # KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. With any of
      # them missing the step fails fast and says so, instead of
      # building unsigned APKs.
      #
      # The release build runs with a 4 GB daemon heap, not the
      # debug build's 3 GB: the release does R8 minification and
      # the lint-vital check, and both run out of heap at 3 GB
      # (seen 2026-11-26: R8 and lintVitalAnalyzeRelease both died
      # with OutOfMemoryError, and the daemon itself died). The
      # debug build fits in 3 GB, so it keeps the smaller heap.
      # lintVital is skipped outright (-x): it is a lint gate, and
      # this workflow does not gate on lint — it only builds APKs.
      - name: Build release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing keystore set. A v* tag build must be signed: add the four repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD, then push the tag again."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true"

      # The APK must contain the chat core this workflow built and
      # the three native libraries the app cannot run without (the
      # tunnel core, the tunnel JNI shim and the Telegram chat
      # library) — the "Fetch the native libraries" step above
      # puts them in, so a missing one is a build failure, not a
      # warning: a missing core used to ship silently and crash
      # the app at startup. The other engine libraries are still
      # reported (as warnings) so a gap stays visible.
      - name: Check the APK's native libraries
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APK=$(ls app/build/outputs/apk/release/*universal-release.apk)
          else
            APK=$(ls app/build/outputs/apk/debug/*universal-debug.apk)
          fi
          echo "Checking $APK"
          unzip -l "$APK" | grep '\.so$' || echo "(no .so files in the APK)"
          if ! unzip -l "$APK" | grep -q 'libmlmchat\.so'; then
            echo "::error::libmlmchat.so is missing from the APK — the native core build did not land in the package."
            exit 1
          fi
          for lib in libtunnelcore.so libtunneljni.so libtmessages.49.so; do
            if ! unzip -l "$APK" | grep -q "$lib"; then
              echo "::error::$lib is missing from the APK — the native-library fetch step did not land it in the package."
              exit 1
            fi
          done
          for lib in libtun2socks.so libaether.so libtun2proxy.so libmhrv_rs.so libtor.so; do
            unzip -l "$APK" | grep -q "$lib" || echo "::warning::$lib is missing from the APK."
          done

      - name: Upload debug APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mlmvpn-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Attach the signed release APKs to the GitHub Release for
      # this tag. This is the ONLY place the release APKs go — there
      # is no artifact upload for a release build (debug builds
      # keep their artifact; release builds go straight to the
      # release). If the release already exists (created by hand,
      # with its own notes), the files are uploaded to it; if it
      # does not exist yet, it is created from the tag with an
      # empty body — the release notes are yours to write on
      # GitHub afterwards. fail_on_unmatched_files makes a missing
      # APK a loud failure instead of a silently empty release.
      # Note the trade-off: if this upload step itself fails, the
      # APKs are not saved anywhere else — the tag build would
      # need to be re-run to get them.
      - name: Attach release APKs to the GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*-release.apk
          fail_on_unmatched_files: true
